  - Sptenmat
  - sptenrand
  - SymTensor
  - SymKTensor
  - SumTensor
  - as.tensor
  - as.tensor.KTensor
  - as.tensor.TTensor
  - as.tensor.Tenmat

- title: Shape, indexing, and predicates
  desc: Reshaping, unfolding, conversion, and structural queries.
  contents:
