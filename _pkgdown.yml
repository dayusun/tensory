url: https://www.sundayu.me/tensory/

template:
  bootstrap: 5
  bslib:
    primary: "#1f4e79"
    code_font: {google: "JetBrains Mono"}

home:
  title: Tensor algebra and tensor regression for R
  description: >
    Dense, sparse, symmetric and factorized tensor classes with a MATLAB Tensor
    Toolbox-style API, compiled xtensor/BLAS kernels, the CP and Tucker
    decomposition families, and three regression models that relate an
    array-valued predictor to a scalar outcome.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: "Using tensors"
      - text: Tensor identities
        href: articles/identities.html
      - text: "Modelling"
      - text: Tensor regression with spgtr()
        href: articles/spgtr.html
      - text: Tensor PLS regression with tepls()
        href: articles/tepls.html
      - text: Quantile regression with pqtr()
        href: articles/pqtr.html
      - text: "Performance"
      - text: Performance guide
        href: articles/performance.html
      - text: Benchmarks vs rTensor
        href: articles/benchmark.html

reference:
- title: Package
  contents:
  - tensory-package

- title: Tensor classes and constructors
  desc: >
    The dense `Tensor` object, its matricized and decomposed relatives, and the
    constructors that build them.
  contents:
